<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Safe Insight Conference</title>

    <script>
        /*
         * Safe Insight conference legacy entry point.
         *
         * Preserve the complete query string while routing the
         * established Student and Administrator URLs to their
         * dedicated conference pages.
         *
         * Student:
         *
         *     /video-conference/?room=LACCW
         *
         * becomes:
         *
         *     /video-conference/student.html?room=LACCW
         *
         * Administrator:
         *
         *     /video-conference/?admin=true&room=LACCW
         *
         * becomes:
         *
         *     /video-conference/admin.html?admin=true&room=LACCW
         *
         * This file has no conference authority or application logic.
         * Its only job is routing the established legacy URLs.
         */

        const conferenceParams =
            new URLSearchParams(
                window.location.search
            );

        const destination =
            conferenceParams.get("admin") === "true"
            ? "admin.html"
            : "student.html";

        window.location.replace(
            destination + window.location.search
        );
    </script>
</head>

<body>
</body>
</html>

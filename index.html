<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Safe Insight Conference</title>

    <script>
        /*
         * Legacy student conference entry point.
         *
         * Preserve the complete query string so existing links such as:
         *
         *     /video-conference/?room=LACCW
         *
         * become:
         *
         *     /video-conference/student.html?room=LACCW
         *
         * This file has no conference authority or application logic.
         * Its only job is routing the legacy student URL.
         */

        window.location.replace(
            "student.html" + window.location.search
        );
    </script>
</head>

<body>
</body>
</html>
